[mcu EBBT0]
canbus_uuid: 43ffe9cd22a5

[extruder]
step_pin: EBBT0:PD0
dir_pin: EBBT0:PD1
enable_pin: !EBBT0:PD2
heater_pin: EBBT0:PB13
sensor_pin: EBBT0:PA3
sensor_type: ATC Semitec 104NT-4-R025H42G

full_steps_per_rotation: 200
microsteps: 16
rotation_distance: 47.088
gear_ratio: 9:1
nozzle_diameter: 0.400
filament_diameter: 1.75

control: pid
pid_kp = 26.114
pid_ki = 3.627
pid_kd = 47.005

min_temp: 10
max_temp: 300
max_power: 1.0

min_extrude_temp: 70
max_extrude_only_distance: 500

pressure_advance: 0.035

[tmc2209 extruder]
uart_pin: EBBT0:PA15
interpolate: false
run_current: 0.6
sense_resistor: 0.110
#stealthchop_threshold: 0

[heater_fan T0_hotend_fan]
pin: EBBT0:PA0
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5

[fan_generic T0_partfan]
pin: EBBT0:PA1

[gcode_macro T0]
variable_spool_id: None
variable_active: 0
variable_color: ""
variable_temp: 0
gcode:
  SELECT_TOOL T=0
  SET_ACTIVE_SPOOL ID={ printer['gcode_macro T0'].spool_id }

#change the tool numbers to the tool you are configuring, ie T0, T1, etc
[tool T0]
#change this too
tool_number: 0
#if this were T1, then this would be extruder1, etc
extruder: extruder
#Change T0_partfan to tool number
fan: fan_generic T0_partfan

#These are build specific, its where the tool is sititng in it's dock.
params_park_x: 6.2
params_park_y: 16.3
params_park_z: 244.50
# For InputShaper run per tool and enter the frequency here
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 60.4
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 41.8

# Change tool number if needed
[tool_probe T0]
pin: ^EBBT0:PB9
tool: 0
x_offset: 0 # X axis-sensor relative nozzle offset
y_offset: 0 # Y axis-sensor relative nozzle offset
# More positive = More squish
z_offset = -1.210 # Tested 7/15/2025
speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder

[adxl345 T0]
cs_pin: EBBT0:PB12
spi_software_sclk_pin: EBBT0:PB10
spi_software_mosi_pin: EBBT0:PB11
spi_software_miso_pin: EBBT0:PB2
axes_map: x,y,z